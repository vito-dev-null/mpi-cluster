name: MPI health check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpi-cluster-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  health:
    timeout-minutes: 15
    runs-on: [self-hosted, mpi-controller]
    steps:
      - uses: actions/checkout@v4
      - name: Check controller and workers
        run: ./scripts/health_check.sh